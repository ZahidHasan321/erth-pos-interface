# Self-hosted stack: Postgres + PostgREST + api + Caddy.
#   cd deploy && cp .env.example .env && (fill it in) && docker compose up -d --build
name: erth

services:
  db:
    image: postgres:17.6
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: postgres
      AUTHENTICATOR_PASSWORD: ${AUTHENTICATOR_PASSWORD:?}
      API_SERVER_PASSWORD: ${API_SERVER_PASSWORD:?}
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-512MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-1536MB}
      - -c
      - work_mem=${PG_WORK_MEM:-16MB}
      - -c
      - max_connections=100
      - -c
      - log_min_duration_statement=1000
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db:/deploy-db:ro
    # Never public. Reach it over an SSH tunnel: ssh -L 5432:127.0.0.1:5432 vps
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    shm_size: 256mb

  rest:
    image: postgrest/postgrest:v12.2.12
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:?}
      # Same cap hosted Supabase used; the apps page past it explicitly.
      PGRST_DB_MAX_ROWS: "1000"
      PGRST_DB_POOL: "20"
      PGRST_SERVER_CORS_ALLOWED_ORIGINS: ${APP_ORIGINS:?}
      PGRST_OPENAPI_MODE: disabled

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://api_server:${API_SERVER_PASSWORD}@db:5432/postgres
      POSTGREST_URL: http://rest:3000
      JWT_SECRET: ${JWT_SECRET:?}
      PUBLIC_URL: ${API_ORIGIN:?}
      ALLOWED_ORIGINS: ${APP_ORIGINS:?}
      STORAGE_DIR: /data/storage
      # Optional: empty disables the login captcha step (try limits still apply).
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
    volumes:
      - storage:/data/storage

  caddy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        VITE_API_URL: ${API_ORIGIN:?}
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
    restart: unless-stopped
    depends_on: [api, rest]
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?}
      SHOP_DOMAIN: ${SHOP_DOMAIN:?}
      WORKSHOP_DOMAIN: ${WORKSHOP_DOMAIN:?}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?}
      API_DOMAIN: ${API_DOMAIN:?}
      API_ORIGIN: ${API_ORIGIN:?}
      HTTP_PORT: ${HTTP_PORT:-80}
      HTTPS_PORT: ${HTTPS_PORT:-443}
      CADDY_GLOBAL_EXTRA: ${CADDY_GLOBAL_EXTRA:-}
    ports:
      - "${HTTP_PORT:-80}:${HTTP_PORT:-80}"
      - "${HTTPS_PORT:-443}:${HTTPS_PORT:-443}"
      - "${HTTPS_PORT:-443}:${HTTPS_PORT:-443}/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      - storage:/srv/storage:ro

volumes:
  db-data:
  storage:
  caddy-data:
  caddy-config:
